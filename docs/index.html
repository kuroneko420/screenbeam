<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>screenbeam</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      gap: 32px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #4fc3f7;
    }
    .sub {
      color: #555;
      font-size: 0.85rem;
      max-width: 360px;
      text-align: center;
      line-height: 1.6;
    }
    .links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      background: #141414;
      border: 1px solid #262626;
      border-radius: 12px;
      padding: 28px 36px;
      min-width: 160px;
      transition: border-color 0.2s, background 0.2s;
    }
    a:hover {
      border-color: #4fc3f7;
      background: #1a1a1a;
    }
    .icon { font-size: 2rem; }
    .label {
      font-size: 1rem;
      font-weight: 600;
      color: #e0e0e0;
    }
    .desc {
      font-size: 0.72rem;
      color: #666;
    }
    .footer {
      color: #333;
      font-size: 0.7rem;
      text-align: center;
      line-height: 1.6;
    }
    .footer a { display: inline; background: none; border: none; padding: 0; min-width: 0; color: #555; }
    .footer a:hover { color: #4fc3f7; }
  </style>
</head>
<body>
  <h1>screenbeam</h1>
  <p class="sub">
    Transfer files between devices using fountain-coded QR codes.
    Screen to camera, no network needed.
  </p>
  <div class="links">
    <a href="sender.html">
      <div class="icon">&#x25a3;</div>
      <div class="label">Send</div>
      <div class="desc">display QR stream</div>
    </a>
    <a href="receiver.html">
      <div class="icon">&#x25ce;</div>
      <div class="label">Receive</div>
      <div class="desc">scan with camera</div>
    </a>
  </div>
  <div class="footer">
    <a href="https://github.com/kuroneko420/screenbeam">github</a>
  </div>
</body>
</html>
